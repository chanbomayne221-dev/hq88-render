# Render Blueprint – deploy 1-click HQ88 Telegram Bot (PostgreSQL)
services:
  - type: web
    name: hq88-telegram-bot
    runtime: node
    plan: starter
    region: singapore
    branch: main
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      # Connection string PostgreSQL (Supabase / Render Postgres / Neon ...)
      - key: DATABASE_URL
        sync: false
      - key: LOG_LEVEL
        value: info
