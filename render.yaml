# Render Blueprint – deploy 1-click HQ88 Telegram Bot
services:
  - type: web
    name: hq88-telegram-bot
    runtime: node
    plan: starter
    region: singapore
    branch: main
    # Ép Render dùng npm (không pnpm) để tránh lỗi ERR_PNPM_IGNORED_BUILDS với better-sqlite3
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: DB_PATH
        value: /var/data/bot.sqlite
      - key: LOG_LEVEL
        value: info
    disk:
      name: bot-data
      mountPath: /var/data
      sizeGB: 1
